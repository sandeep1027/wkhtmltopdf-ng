<!doctype html>
<html><head><meta charset="utf-8"><title>Insert pages</title>
<style>
  @page { size: A4; margin: 12mm; }
  .sheet { break-after: page; page-break-after: always; font-family: sans-serif; }
  .sheet:last-child { break-after: auto; page-break-after: auto; }
</style></head>
<body>
<section class="sheet"><h1>INSERT-A</h1><p>new first</p></section>
<section class="sheet"><h1>INSERT-B</h1><p>new second</p></section>
</body></html>
