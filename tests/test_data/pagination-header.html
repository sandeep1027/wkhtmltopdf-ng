<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    .pagination-header {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      font-family: sans-serif;
      font-size: 10pt;
      color: #163e64;
      border-bottom: 1.5px solid #163e64;
      padding: 0 0 3px;
    }
    .pagination-header .left { text-align: left; }
    .pagination-header .center { text-align: center; font-weight: 700; letter-spacing: 0.04em; }
    .pagination-header .right { text-align: right; font-variant-numeric: tabular-nums; }
  </style>
</head>
<body>
  <div class="pagination-header">
    <div class="left">[doctitle]</div>
    <div class="center">PAGINATION-HEADER</div>
    <div class="right">[page] / [topage]</div>
  </div>
</body>
</html>
