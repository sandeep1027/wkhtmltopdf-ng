<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Heavy 60-page image + JS bench</title>
  <style>
    body { margin: 0; font: 14px/1.4 sans-serif; color: #122033; }
    .sheet { min-height: 230mm; padding: 8mm; page-break-after: always; break-after: page; }
    .sheet:last-child { page-break-after: auto; break-after: auto; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; }
    img { width: 140px; height: 88px; object-fit: cover; border: 1px solid #ccc; }
    .mark { font-family: monospace; }
  </style>
</head>
<body>
  <p class="mark" id="status">HEAVY-PENDING</p>
  <div id="root"></div>
  <script>
    (async function () {
      const srcs = [
        "assets/heavy-1.png", "assets/heavy-2.png", "assets/heavy-3.png",
        "assets/heavy-4.png", "assets/heavy-5.png", "assets/heavy-6.png"
      ];
      const root = document.getElementById("root");
      let html = "";
      for (let p = 1; p <= 60; p++) {
        const n = String(p).padStart(2, "0");
        html += '<section class="sheet"><h1>Heavy page ' + n + "</h1>" +
          '<p class="mark">HEAVY-PAGE-' + n + "</p><div class=\"row\">";
        for (let i = 0; i < 6; i++) {
          html += '<img src="' + srcs[i] + '" alt="h' + p + '-' + i + '">';
        }
        html += "</div></section>";
      }
      root.innerHTML = html;
      const imgs = Array.from(document.images);
      await Promise.all(imgs.map(function (img) {
        if (img.complete) return Promise.resolve();
        return new Promise(function (res) {
          img.addEventListener("load", res, { once: true });
          img.addEventListener("error", res, { once: true });
        });
      }));
      const ok = imgs.filter(function (img) { return img.naturalWidth > 0; }).length;
      let hash = 0;
      imgs.forEach(function (img, idx) {
        hash = (hash + img.naturalWidth * 17 + img.naturalHeight * 3 + idx) % 1000003;
      });
      document.getElementById("status").textContent =
        "HEAVY-READY pages=60 images=" + ok + " hash=" + hash;
      window.__heavyOk = ok;
      window.status = "heavy-done";
    })().catch(function (err) {
      document.getElementById("status").textContent = "HEAVY-FAILED " + err;
      window.status = "heavy-failed";
    });
  </script>
</body>
</html>
