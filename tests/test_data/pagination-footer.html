<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    .pagination-footer {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      font-family: sans-serif;
      font-size: 9pt;
      color: #5d6b7a;
      border-top: 1.5px solid #c45c26;
      padding: 3px 0 0;
    }
    .pagination-footer .left { text-align: left; }
    .pagination-footer .center { text-align: center; font-weight: 700; color: #7a2d12; }
    .pagination-footer .right { text-align: right; font-variant-numeric: tabular-nums; }
  </style>
</head>
<body>
  <div class="pagination-footer">
    <div class="left">from [frompage]</div>
    <div class="center">PAGINATION-FOOTER</div>
    <div class="right">[page]/[topage]</div>
  </div>
</body>
</html>
