version: 0.14.2
image_prefix: wkhtmltopdf-ng

# The first supported package matrix uses distributions that ship Qt 6
# WebEngine development packages. Debian 11 requires a separately supplied
# Qt 6 WebEngine toolchain and is intentionally not enabled by default.
targets:
  ubuntu24-amd64:
    base_image: ubuntu:24.04
    package_format: deb
    architecture: amd64
    qt: 6.4
    requires_custom_qt: true
    enabled: false
  ubuntu24-arm64:
    base_image: ubuntu:24.04
    package_format: deb
    architecture: arm64
    qt: 6.4
    requires_custom_qt: true
    enabled: false
  ubuntu22-amd64:
    base_image: ubuntu:22.04
    package_format: deb
    architecture: amd64
    qt: 6.2
    requires_custom_qt: true
    enabled: false
  debian12-amd64:
    base_image: debian:12
    package_format: deb
    architecture: amd64
    qt: 6.4
    requires_custom_qt: true
    enabled: false
  debian13-amd64:
    base_image: debian:13
    package_format: deb
    architecture: amd64
    qt: 6.8
    enabled: true
  debian13-arm64:
    base_image: debian:13
    package_format: deb
    architecture: arm64
    qt: 6.8
    enabled: true
  debian11-amd64:
    base_image: debian:11
    package_format: deb
    architecture: amd64
    requires_custom_qt: true
    enabled: false
  windows-amd64:
    runner: windows-latest
    package_format: zip
    architecture: amd64
    qt: 6.8
    uses_aqtinstall: true
    enabled: true
  macos:
    runner: macos-latest
    package_format: zip
    architecture: universal
    qt: 6.8
    uses_aqtinstall: true
    enabled: true
