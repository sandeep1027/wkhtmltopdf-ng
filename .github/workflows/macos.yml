name: Build macOS Package

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  macos:
    name: macOS
    runs-on: macos-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install aqtinstall
        run: pip install aqtinstall

      - name: Install Qt 6.8 with WebEngine
        run: |
          aqt install-qt mac desktop 6.8.3 macos -m qtwebengine \
            --outputdir "$RUNNER_TEMP/qt"

      - name: Package
        run: |
          bash packaging/scripts/package-macos.sh \
            "$RUNNER_TEMP/qt/6.8.3/macos" "$PWD" "$PWD/dist"

      - name: Smoke test version output
        run: |
          unzip -q dist/*.zip -d "$RUNNER_TEMP/smoke"
          "$RUNNER_TEMP/smoke/wkhtmltopdf-ng" --version

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*.zip

      - name: Attach zip to GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF_NAME}"
          for i in $(seq 1 36); do
            gh release view "$tag" >/dev/null 2>&1 && break
            sleep 10
          done
          gh release upload "$tag" dist/*.zip --clobber